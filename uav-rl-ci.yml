# UAV 2D Navigation Environment (Version 2)

- LiDAR sensor (forward FOV, noise, dropout)
- Static and dynamic obstacles (circle & rectangle)
- Wind disturbances
- Heading-based UAV movement
- PPO training with Stable-Baselines3


## ⚙️ Installation

Create and activate virtual environment:

```bash
python3 -m venv venv
source venv/bin/activate
